name: Build JCOW407 OpenWrt Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'jcow407.defconfig'
      - 'target/linux/airoha/**'
      - 'target/linux/econet/**'
      - 'files/**'
      - '.github/workflows/build-jcow407.yml'

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker image prune -a -f || true
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync unzip zlib1g-dev file python3 libelf-dev subversion

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure for JCOW407
        run: |
          cp jcow407.defconfig .config
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8

      - name: Compile OpenWrt Firmware
        run: |
          echo "Building with $(nproc) threads..."
          make -j$(nproc) || make -j1 V=s

      - name: List Artifacts
        run: |
          ls -la bin/targets/airoha/en7528/ || true

      - name: Upload Firmware Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-jcow407-images
          path: |
            bin/targets/*/*/*jcow407*
            bin/targets/*/*/*.trx
            bin/targets/*/*/*.bin
